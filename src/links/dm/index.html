<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<!-- useroster.xyz/dm: the address for direct messages. It forwards to the homepage with campaign tags,
     so a visit from a link that arrives with no referrer (in-app browsers, messaging and email
     apps) is still credited to where it was shared. Any tags on this address, such as
     ?utm_content=..., are passed on and take precedence. It loads no analytics itself. -->
<title>Roster</title>
<meta name="robots" content="noindex" />
<link rel="canonical" href="https://useroster.xyz/" />
<meta http-equiv="refresh" content="0; url=/?utm_source=direct_message&amp;utm_medium=dm&amp;utm_campaign=outreach" />
<script>
  (function () {
    var tags = new URLSearchParams("utm_source=direct_message&utm_medium=dm&utm_campaign=outreach");
    new URLSearchParams(location.search).forEach(function (v, k) {
      tags.set(k, v);
    });
    location.replace("/?" + tags.toString() + location.hash);
  })();
</script>
</head>
<body>
<p><a href="/?utm_source=direct_message&amp;utm_medium=dm&amp;utm_campaign=outreach">Continue to Roster</a></p>
</body>
</html>
