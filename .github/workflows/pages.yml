# Publishes the site to GitHub Pages. The pages are plain HTML; the build only arranges src/ into
# the flat addresses the site has always had (see scripts/build.mjs), and the check stops the
# deploy if any page links to something that isn't there.
#
# The site lives in its own public repo because Pages is not available on private repos on the
# free plan, and the application code stays private.
name: Marketing site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# A queued run replaces a waiting one rather than stacking: only the newest site matters.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run build
      - run: npm run check
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
